<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Тетрадь ученика</title>
    <!--
      «Фото» тетради для сценария grade:photo — проверка самостоятельной по фото.
      Задания — GRADE_TASKS в variant.mjs. Решено: № 1, 2, 4 — верно; № 3 — ошибка в знаке
      (x₀ = −6/2 вместо −(−6)/2), отсюда неверный ответ; № 5 — не решено.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #fdfcf6;
      }
      body {
        width: 900px;
        height: 620px;
        overflow: hidden;
        background-image: repeating-linear-gradient(#fdfcf6 0 43px, #b9d3ee 43px 44px);
        font-family: 'Comic Sans MS', 'Segoe Print', 'DejaVu Sans', cursive;
        color: #1d3a8a;
        font-size: 27px;
        line-height: 44px;
      }
      .page {
        padding: 0 40px 0 70px;
        border-left: 2px solid #e8a3a3;
        margin-left: 60px;
        height: 100%;
        box-sizing: border-box;
        transform: rotate(-0.5deg);
      }
      .title {
        text-align: center;
      }
      .n {
        display: inline-block;
        width: 60px;
      }
      .in {
        padding-left: 60px;
      }
      sup {
        font-size: 18px;
        line-height: 0;
      }
      sub {
        font-size: 18px;
        line-height: 0;
      }
      .ans {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">Самостоятельная работа</div>
      <div><span class="n">№1.</span>Б</div>
      <div><span class="n">№2.</span>y(−1) = (−1)<sup>2</sup> − 4·(−1) + 3 = 1 + 4 + 3 = 8</div>
      <div class="in ans">Ответ: 8</div>
      <div><span class="n">№3.</span>x<sub>0</sub> = −b/2a = −6/2 = −3</div>
      <div class="in">y<sub>0</sub> = (−3)<sup>2</sup> − 6·(−3) + 5 = 9 + 18 + 5 = 32</div>
      <div class="in ans">Ответ: (−3; 32)</div>
      <div><span class="n">№4.</span>x<sub>0</sub> = −b/2a = 8/2 = 4</div>
      <div class="in">y(4) = 16 − 32 + 10 = −6</div>
      <div class="in ans">Ответ: −6</div>
    </div>
  </body>
</html>
