<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Решение ученика</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fdfcf6;
      }
      body {
        width: 900px;
        height: 560px;
        background-image: repeating-linear-gradient(#fdfcf6 0 43px, #b9d3ee 43px 44px);
        font-family: 'Comic Sans MS', 'Segoe Print', 'DejaVu Sans', cursive;
        color: #1d3a8a;
        font-size: 30px;
        line-height: 44px;
      }
      .page {
        padding: 22px 40px 0 90px;
        border-left: 2px solid #e8a3a3;
        margin-left: 60px;
        height: 100%;
        box-sizing: border-box;
        transform: rotate(-0.6deg);
      }
      sup {
        font-size: 20px;
        line-height: 0;
      }
      .ans {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div>Решить уравнение: 3<sup>2x − 1</sup> = 27</div>
      <div>1) 27 = 3<sup>3</sup>, значит 3<sup>2x − 1</sup> = 3<sup>3</sup></div>
      <div>2) 2x − 1 = 3</div>
      <div>3) 2x = 2</div>
      <div>4) x = 1</div>
      <div class="ans">Ответ: x = 1</div>
    </div>
  </body>
</html>
