name: Deploy to own server

# «Крок» на своём сервере вместо Cloudflare Workers. GitHub собирает Docker-образ, проверяет
# его тут же (приложение, API, поток ответа ИИ), по SSH загружает на сервер вместе с
# deploy/compose.yml и deploy/Caddyfile, перезапускает и переключает на сервер бота.
# Пошагово — docs/ДЕПЛОЙ.md, раздел «Свой сервер».
#
# Секреты (Settings → Secrets and variables → Actions → Secrets):
#   SERVER_HOST          — IP или имя сервера
#   SERVER_USER          — пользователь SSH: root или пользователь из группы docker
#   SERVER_PASSWORD      — пароль этого пользователя, или вместо него
#   SERVER_SSH_KEY       — закрытый ключ (открытый лежит в ~/.ssh/authorized_keys на сервере)
#   SERVER_KNOWN_HOSTS   — по желанию, но лучше задать: ключ сервера, защита от подмены
#                          (строка из `ssh-keyscan` или содержимое /etc/ssh/ssh_host_ed25519_key.pub)
#   SERVER_PORT          — по желанию, если SSH не на 22-м порту
#   BOT_TOKEN            — токен бота; GEMINI_API_KEY — по желанию
#   CLOUDFLARE_AI_TOKEN  — по желанию: Qwen через Workers AI (токен с правом «Workers AI: Read»)
# Домен: переменная KROK_DOMAIN (вкладка Variables, можно и в Secrets) с записью A на IP сервера;
# без неё — krok-ct.duckdns.org.
#
# Без секретов сервера запуск только собирает и проверяет образ.
#
# Галочка eval после деплоя прогоняет «пробный вариант» (worker/scripts/ai-eval.mjs) на сервере:
# разбор ошибок, проверка по фото, урок «Объясни мне это», самостоятельная и её проверка по фото
# тетради. Отчёт — в сводке запуска и в артефакте ai-eval.

on:
  workflow_dispatch:
    inputs:
      allow_anonymous:
        description: 'ИИ и на сайте, без Telegram: у гостя лимит по IP вдвое меньше, у всех гостей вместе — общий дневной потолок'
        type: boolean
        default: true
      switch_bot:
        description: 'Переключить бота на сервер и выключить напоминания старого воркера Cloudflare'
        type: boolean
        default: true
      eval:
        description: 'После деплоя прогнать пробный вариант (проверка качества ИИ)'
        type: boolean
        default: false
      eval_scenarios:
        description: 'Сценарии пробного варианта через запятую, например lesson:topic,selftest:math5,grade:photo (пусто — все)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KROK_IMAGE: krok:${{ github.sha }}
      # Домен: переменная или секрет KROK_DOMAIN, иначе — адрес «Крока» по умолчанию.
      KROK_DOMAIN: ${{ vars.KROK_DOMAIN || secrets.KROK_DOMAIN || 'krok-ct.duckdns.org' }}
      # Мини-апп открывается с GitHub Pages (pages.yml), сервер — только ИИ и бот.
      # Переменная KROK_APP_URL — другой адрес мини-аппа.
      MINI_APP_URL: ${{ vars.KROK_APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Доступ к серверу
        id: target
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_LOGIN: ${{ secrets.SERVER_PASSWORD != '' || secrets.SERVER_SSH_KEY != '' }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          missing=""
          for name in SERVER_HOST SERVER_USER BOT_TOKEN KROK_DOMAIN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ "$SERVER_LOGIN" = true ] || missing="$missing SERVER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice title=Только сборка и проверка образа::На сервер не выкладываем — не хватает:$missing. Как их получить — docs/ДЕПЛОЙ.md, раздел «Свой сервер»."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH
        if: steps.target.outputs.ready == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        # Одно соединение на весь деплой: пароль вводится один раз, остальные шаги идут через него.
        run: bash deploy/ssh-setup.sh

      - name: Сервер — Docker и HTTPS
        id: server
        if: steps.target.outputs.ready == 'true'
        run: |
          set -o pipefail
          ssh krok 'bash -s' < deploy/server-prepare.sh | tee "$RUNNER_TEMP/prepare.log"
          mode="$(sed -n 's/^KROK_MODE=//p' "$RUNNER_TEMP/prepare.log" | tail -n 1)"
          [ "$mode" = caddy ] || [ "$mode" = nginx ]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Сборка образа
        run: docker build --build-arg VITE_BOT_USERNAME="${{ vars.VITE_BOT_USERNAME || 'PFPFISJFOIJBOT' }}" -t "$KROK_IMAGE" .

      - name: Проверка образа
        run: |
          docker run -d --name krok-check -p 8080:8080 -e ALLOW_MOCK_AI=true -e ALLOW_ANONYMOUS=true "$KROK_IMAGE" >/dev/null
          ok=0
          node worker/scripts/container-check.mjs http://127.0.0.1:8080 || ok=1
          if [ "$(docker exec krok-check id -u)" = "0" ]; then echo "✗ контейнер работает от root"; ok=1; else echo "✓ контейнер работает не от root"; fi
          if docker exec krok-check test -f /data/krok.sqlite; then echo "✓ база создана в томе /data"; else echo "✗ база не создана в /data"; ok=1; fi
          [ "$ok" = 0 ] || docker logs krok-check
          docker rm -f krok-check >/dev/null
          exit "$ok"

      - name: Загрузка образа на сервер
        if: steps.target.outputs.ready == 'true'
        timeout-minutes: 20
        run: |
          set -o pipefail
          ssh krok 'mkdir -p ~/krok'
          scp -q deploy/compose.yml deploy/Caddyfile krok:krok/
          image="$RUNNER_TEMP/krok-image.tar.gz"
          docker save "$KROK_IMAGE" | gzip -1 > "$image"
          size=$(stat -c %s "$image")
          echo "Образ: $(( size / 1048576 )) МБ в сжатом виде"
          # Сеть до сервера иногда «залипает»: передача и загрузка в Docker идут отдельно, чтобы
          # было видно, что тормозит, а оборванную передачу rsync докачивает со следующей попытки.
          for attempt in 1 2 3; do
            started=$(date +%s)
            timeout 240 rsync --partial --inplace -e ssh "$image" krok:krok/image.tar.gz 2>/dev/null \
              || timeout 240 scp -q "$image" krok:krok/image.tar.gz || true
            if [ "$(ssh krok 'stat -c %s ~/krok/image.tar.gz 2>/dev/null')" = "$size" ]; then
              echo "Передано за $(( $(date +%s) - started )) с"
              break
            fi
            echo "::warning title=Передача образа::Попытка $attempt не удалась или зависла — повторяем"
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          started=$(date +%s)
          timeout 300 ssh krok 'gunzip -c ~/krok/image.tar.gz | docker load && rm -f ~/krok/image.tar.gz'
          echo "Загружено в Docker за $(( $(date +%s) - started )) с"

      - name: Запуск на сервере
        if: steps.target.outputs.ready == 'true'
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_ORIGINS: https://${{ github.repository_owner }}.github.io
          ALLOW_ANONYMOUS: ${{ inputs.allow_anonymous }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          AI_VISION_PROVIDERS: ${{ vars.AI_VISION_PROVIDERS }}
          KROK_MODE: ${{ steps.server.outputs.mode }}
        run: |
          set -o pipefail
          # Секреты уходят прямо на сервер (файл .env только для владельца) и в лог не попадают.
          node scripts/server-env.mjs | ssh krok 'umask 077 && cat > krok/.env'
          ssh krok "KROK_MODE=$KROK_MODE bash -s" < ../deploy/server-up.sh | tee "$RUNNER_TEMP/up.log"
          port="$(sed -n 's/^KROK_PORT=//p' "$RUNNER_TEMP/up.log" | tail -n 1)"
          # Сервер уже с nginx и другими сайтами — добавляем ему свой сайт с сертификатом.
          if [ "$KROK_MODE" = nginx ]; then
            ssh krok "KROK_DOMAIN=$KROK_DOMAIN KROK_PORT=$port bash -s" < ../deploy/nginx-site.sh
          fi
          # Старые версии образа не копятся: оставляем только текущую.
          ssh krok "docker image ls krok --format '{{.Repository}}:{{.Tag}}' | grep -vx '$KROK_IMAGE' | xargs -r docker image rm >/dev/null 2>&1 || true"

      - name: Ждём HTTPS
        if: steps.target.outputs.ready == 'true'
        run: |
          # Первый запуск: Caddy получает сертификат Let's Encrypt — это до минуты-двух.
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "https://$KROK_DOMAIN/api/health" >/dev/null 2>&1; then
              echo "https://$KROK_DOMAIN отвечает"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Сайт не открылся по HTTPS::Проверьте, что запись A домена $KROK_DOMAIN указывает на сервер, а порты 80 и 443 открыты в файрволе хостинга"
          ssh krok 'cd krok && docker compose --profile caddy logs --tail=40' || true
          exit 1

      - name: Бот — вебхук, кнопка меню, команды
        if: steps.target.outputs.ready == 'true' && inputs.switch_bot
        run: node scripts/setup-bot.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_URL: https://${{ env.KROK_DOMAIN }}
          BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME || 'PFPFISJFOIJBOT' }}

      - name: Старый воркер Cloudflare — без напоминаний
        if: steps.target.outputs.ready == 'true' && inputs.switch_bot
        run: node scripts/cloudflare-retire.mjs
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Проверка после деплоя
        if: steps.target.outputs.ready == 'true'
        run: node scripts/smoke.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_URL: https://${{ env.KROK_DOMAIN }}

  eval:
    needs: deploy
    if: ${{ inputs.eval }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KROK_DOMAIN: ${{ vars.KROK_DOMAIN || secrets.KROK_DOMAIN || 'krok-ct.duckdns.org' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Решение ученика, параграф учебника и тетрадь с самостоятельной — для сценариев с фото.
      - name: «Фото» для пробного варианта
        run: bash worker/scripts/eval/render.sh "$RUNNER_TEMP/eval-images"

      - name: Пробный вариант
        run: node scripts/ai-eval.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_URL: https://${{ env.KROK_DOMAIN }}
          SCENARIOS: ${{ inputs.eval_scenarios }}
          EVAL_IMAGES: ${{ runner.temp }}/eval-images
          EVAL_OUT: ${{ runner.temp }}/eval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval
          path: |
            ${{ runner.temp }}/eval
            ${{ runner.temp }}/eval-images
          if-no-files-found: ignore
