name: Deploy to Cloudflare

# Один запуск = мини-апп + воркер с ИИ + база + Telegram-бот. Компьютер не нужен.
#
# Секреты репозитория (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   — токен Cloudflare: шаблон «Edit Cloudflare Workers» + Account → D1 → Edit
#   BOT_TOKEN              — токен бота из @BotFather (/mybots → бот → API Token)
#   CLOUDFLARE_ACCOUNT_ID  — по желанию; без него берётся единственный аккаунт токена
#   GEMINI_API_KEY         — по желанию: Gemini проверяет фото решений и подстраховывает текст
#   OPENAI_API_KEY         — по желанию: любой OpenAI-совместимый API (адрес и модель — в wrangler.jsonc)
#
# Что делает: создаёт базу D1 и поддомен workers.dev (если их нет), применяет
# миграции, собирает и публикует воркер, кладёт секреты, ставит вебхук, кнопку меню
# и команды бота, затем проверяет всё живым запросом. Повторный запуск безопасен.
# Секреты воркера в git не попадают; секрет вебхука выводится из токена бота.
#
# Галочка eval после деплоя прогоняет «пробный вариант» (worker/scripts/ai-eval.mjs):
# ученик решает задания с ошибками, ИИ их разбирает; отчёт — в сводке и артефакте.

on:
  workflow_dispatch:
    inputs:
      allow_anonymous:
        description: 'Пускать к ИИ из обычного браузера (показ с ноутбука; лимиты для анонимов строже)'
        type: boolean
        default: false
      eval:
        description: 'После деплоя прогнать пробный вариант (проверка качества ИИ)'
        type: boolean
        default: false
      eval_models:
        description: 'Модели для пробного варианта через запятую: @cf/… , gemini:… , openai:… (пусто — как у учеников)'
        type: string
        default: ''
      eval_scenarios:
        description: 'Сценарии пробного варианта через запятую, например generate,check:photo (пусто — все)'
        type: string
        default: ''
      e2e:
        description: 'После деплоя пройти путь ученика в настоящем браузере (скриншоты)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN BOT_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Нет секрета $name::Добавьте $name в Settings → Secrets and variables → Actions"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Установка зависимостей и сборка идут без секретов: скрипты пакетов их не видят.
      - run: npm ci

      - name: Сборка мини-аппа
        run: npm run build:pwa
        env:
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}

      - run: npm ci
        working-directory: worker

      - name: Cloudflare — аккаунт, база D1, поддомен
        run: node scripts/cloudflare-prepare.mjs
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGINS: https://${{ github.repository_owner }}.github.io
          ALLOW_ANONYMOUS: ${{ inputs.allow_anonymous }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          AI_VISION_PROVIDERS: ${{ vars.AI_VISION_PROVIDERS }}

      - name: Миграции D1
        run: npx wrangler d1 migrations apply krok --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Деплой воркера
        run: |
          node scripts/write-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Удаление файла с секретами
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Бот — вебхук, кнопка меню, команды
        run: node scripts/setup-bot.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME || 'PFPFISJFOIJBOT' }}

      - name: Проверка после деплоя
        run: node scripts/smoke.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  eval:
    needs: deploy
    if: ${{ inputs.eval }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Фото решения для проверки по фото
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=900,560 --screenshot="$RUNNER_TEMP/solution.png" \
            "file://$GITHUB_WORKSPACE/worker/scripts/eval/solution.html"
          ls -l "$RUNNER_TEMP/solution.png"

      - name: Пробный вариант
        run: node scripts/ai-eval.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODELS: ${{ inputs.eval_models }}
          SCENARIOS: ${{ inputs.eval_scenarios }}
          EVAL_IMAGE: ${{ runner.temp }}/solution.png
          EVAL_OUT: ${{ runner.temp }}/eval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval
          path: |
            ${{ runner.temp }}/eval
            ${{ runner.temp }}/solution.png
          if-no-files-found: ignore

  e2e:
    needs: deploy
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Фото решения
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=900,560 --screenshot="$RUNNER_TEMP/solution.png" \
            "file://$GITHUB_WORKSPACE/worker/scripts/eval/solution.html"

      # Браузер не скачиваем: тест идёт в установленном на раннере Chrome.
      - name: Playwright
        run: npm install --no-save --no-package-lock playwright@1.63.0
        working-directory: worker
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Путь ученика в браузере
        run: node scripts/e2e.mjs
        working-directory: worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          EVAL_IMAGE: ${{ runner.temp }}/solution.png
          EVAL_OUT: ${{ runner.temp }}/e2e

      # Скриншоты дублируются в лог (base64), чтобы их можно было разобрать без скачивания артефакта.
      - name: Скриншоты в лог
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e/*.jpg; do
            [ -f "$f" ] || continue
            echo "=====SHOT $(basename "$f")====="
            base64 -w0 "$f"; echo
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
