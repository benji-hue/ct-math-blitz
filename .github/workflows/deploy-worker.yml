name: Deploy to Cloudflare

# Публикует мини-апп и воркер одной командой (статика + API + бот).
# Нужны секреты репозитория CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID
# и, по желанию, переменная VITE_BOT_USERNAME (имя бота без @).
# Секреты самого воркера (BOT_TOKEN, WEBHOOK_SECRET…) задаются один раз
# через `wrangler secret put` и в репозитории не хранятся.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Сборка мини-аппа
        run: npm run build:pwa
        env:
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}
      - run: npm ci
        working-directory: worker
      - name: Миграции D1
        run: npx wrangler d1 migrations apply krok --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Деплой воркера
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
