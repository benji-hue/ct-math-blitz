<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="0.55" stop-color="#0c0b1f"/>
      <stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#6a56ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6a56ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#00a6c9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00a6c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="step" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9d8fff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowA)"/>
  <rect width="1024" height="1024" fill="url(#glowB)"/>
  <!-- три ступени: «крок» по-белорусски — «шаг» -->
  <rect x="232" y="596" width="148" height="196" rx="46" fill="url(#step)" opacity="0.5"/>
  <rect x="438" y="440" width="148" height="352" rx="46" fill="url(#step)" opacity="0.78"/>
  <rect x="644" y="232" width="148" height="560" rx="46" fill="url(#step)"/>
